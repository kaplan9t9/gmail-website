<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gmail Manager - Reset Password</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-logo">
      <h1>📧 Gmail Manager</h1>
      <p>Reset your password</p>
    </div>

    <form class="auth-form" id="resetForm">
      <h2>Forgot Password</h2>
      <div id="resetAlert"></div>

      <div class="form-group">
        <label>EasyPaisa Number</label>
        <input type="text" id="resetNumber" placeholder="03XX-XXXXXXX" required>
      </div>

      <div class="form-group">
        <label>New Password</label>
        <input type="password" id="newPassword" placeholder="Enter new password" required minlength="6">
      </div>

      <div class="form-group">
        <label>Confirm New Password</label>
        <input type="password" id="confirmNewPassword" placeholder="Confirm new password" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="resetBtn">
        Reset Password
      </button>

      <div class="auth-links">
        <a href="/">Back to Sign In</a>
      </div>
    </form>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    const API = '/api';

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('resetBtn');
      const number = document.getElementById('resetNumber').value.trim();
      const newPassword = document.getElementById('newPassword').value;
      const confirmNewPassword = document.getElementById('confirmNewPassword').value;

      if (newPassword !== confirmNewPassword) {
        showAlert('resetAlert', 'Passwords do not match', 'error');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Resetting...';

      try {
        const res = await fetch(`${API}/auth`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'forgot-password', number, newPassword })
        });
        const data = await res.json();

        if (!res.ok) {
          showAlert('resetAlert', data.error, 'error');
          btn.disabled = false;
          btn.textContent = 'Reset Password';
          return;
        }

        showAlert('resetAlert', 'Password reset successful! Redirecting...', 'success');
        setTimeout(() => window.location.href = '/', 2000);
      } catch (err) {
        showAlert('resetAlert', 'Connection error. Please try again.', 'error');
        btn.disabled = false;
        btn.textContent = 'Reset Password';
      }
    });

    function showAlert(id, msg, type) {
      document.getElementById(id).innerHTML =
        `<div class="alert alert-${type}">${type === 'error' ? '⚠️' : '✅'} ${msg}</div>`;
    }
  </script>
</body>
</html>
