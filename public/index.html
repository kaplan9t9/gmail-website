<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gmail Manager - Login</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-logo">
      <h1>📧 Gmail Manager</h1>
      <p>Manage your Gmail accounts efficiently</p>
    </div>

    <form class="auth-form" id="loginForm">
      <h2>Welcome Back</h2>
      <div id="loginAlert"></div>

      <div class="form-group">
        <label>EasyPaisa Number</label>
        <input type="text" id="loginNumber" placeholder="03XX-XXXXXXX" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="Enter your password" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
        Sign In
      </button>

      <div class="auth-links">
        <a href="/forgot-password.html">Forgot Password?</a>
        <br><br>
        Don't have an account? <a href="/signup.html">Sign Up</a>
      </div>

      <div class="admin-login-link">
        <a href="/admin.html">🔐 Admin Login</a>
      </div>
    </form>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    const API = '/api';

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const number = document.getElementById('loginNumber').value.trim();
      const password = document.getElementById('loginPassword').value;

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Signing in...';

      try {
        const res = await fetch(`${API}/auth`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'login', number, password })
        });
        const data = await res.json();

        if (!res.ok) {
          showAlert('loginAlert', data.error, 'error');
          btn.disabled = false;
          btn.textContent = 'Sign In';
          return;
        }

        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        window.location.href = '/dashboard.html';
      } catch (err) {
        showAlert('loginAlert', 'Connection error. Please try again.', 'error');
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });

    function showAlert(id, msg, type) {
      document.getElementById(id).innerHTML =
        `<div class="alert alert-${type}">${type === 'error' ? '⚠️' : '✅'} ${msg}</div>`;
    }

    // Redirect if already logged in
    if (localStorage.getItem('token')) {
      window.location.href = '/dashboard.html';
    }
  </script>
</body>
</html>
