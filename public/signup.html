<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gmail Manager - Sign Up</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-logo">
      <h1>📧 Gmail Manager</h1>
      <p>Create your account</p>
    </div>

    <form class="auth-form" id="signupForm">
      <h2>Sign Up</h2>
      <div id="signupAlert"></div>

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="fullName" placeholder="Enter your full name" required>
      </div>

      <div class="form-group">
        <label>EasyPaisa Number</label>
        <input type="text" id="easyPaisaNumber" placeholder="03XX-XXXXXXX" required>
      </div>

      <div class="form-group">
        <label>Gmail Address</label>
        <input type="email" id="gmail" placeholder="you@gmail.com" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Minimum 6 characters" required minlength="6">
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Re-enter your password" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="signupBtn">
        Create Account
      </button>

      <div class="auth-links">
        Already have an account? <a href="/">Sign In</a>
      </div>
    </form>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    const API = '/api';

    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('signupBtn');
      const fullName = document.getElementById('fullName').value.trim();
      const easyPaisaNumber = document.getElementById('easyPaisaNumber').value.trim();
      const gmail = document.getElementById('gmail').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        showAlert('signupAlert', 'Passwords do not match', 'error');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Creating account...';

      try {
        const res = await fetch(`${API}/auth`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'signup', fullName, easyPaisaNumber, gmail, password, confirmPassword
          })
        });
        const data = await res.json();

        if (!res.ok) {
          showAlert('signupAlert', data.error, 'error');
          btn.disabled = false;
          btn.textContent = 'Create Account';
          return;
        }

        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        window.location.href = '/dashboard.html';
      } catch (err) {
        showAlert('signupAlert', 'Connection error. Please try again.', 'error');
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    });

    function showAlert(id, msg, type) {
      document.getElementById(id).innerHTML =
        `<div class="alert alert-${type}">${type === 'error' ? '⚠️' : '✅'} ${msg}</div>`;
    }
  </script>
</body>
</html>
